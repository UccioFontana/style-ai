services:
  styleai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: styleai_flutter_app
    ports:
      - "3000:3000"
    volumes:
      - ./styleai:/workspace/styleai:delegated
      - flutter_pub_cache:/root/.pub-cache
      - flutter_build:/workspace/styleai/build
      - flutter_dart_tool:/workspace/styleai/.dart_tool
    working_dir: /workspace/styleai
    stdin_open: true
    tty: true
    command: >
      bash -c "flutter pub get &&
      flutter run -d web-server --web-hostname 0.0.0.0 --web-port 3000"

volumes:
  flutter_pub_cache:
  flutter_build:
  flutter_dart_tool: